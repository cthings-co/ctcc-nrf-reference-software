name: CTCC Firmwares CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    uses: ./.github/workflows/release-firmwares.yml
    with:
      source_ref: ${{ github.sha }}
      event_name: ${{ github.event_name }}
      ref_name: ${{ github.ref_name }}
      trusted_release: false
    secrets: inherit
