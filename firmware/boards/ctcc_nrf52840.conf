# USB descriptors for the example firmware. 0xF00F is the ctcc dummy PID (for
# tests/demos). Set here directly - a CI `-DCONFIG_CDC_ACM_SERIAL_PID` override
# does NOT reach the application image under sysbuild - so both CI and a plain
# local `west build` enumerate as the CTHINGS VID/PID instead of the Zephyr
# fallback 0x2FE3:0x0004.
CONFIG_CDC_ACM_SERIAL_VID=0x37A1
CONFIG_CDC_ACM_SERIAL_PID=0xF00F
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="CTHINGS.CO"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="CTCC-DEVICE"

# Boot banner
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=y
# No BOOT_BANNER_STRING here: firmware/VERSION exists, so the banner patch takes its
# APP_VERSION_STRING branch and never reads the fallback string. tests/assembly has
# no VERSION file and does set it.

# APPROTECT (debug read-back lock) is defaulted board-wide by patches/zephyr/0003
# (the NRF_APPROTECT_HANDLING choice defaults to LOCK - a default, so a .conf can
# override it), so it is not set per-app here - but note that
# every image in this repository deliberately OPTS OUT again, and this example is
# one of them: see CONFIG_NRF_APPROTECT_USE_UICR=y and CONFIG_CTCC_APP_PROTECT=n in
# firmware/prj.conf, with the same pair in firmware/sysbuild/mcuboot/prj.conf and
# tests/assembly/prj.conf. Nothing built here locks a card; product firmware must,
# on the bootloader as well as the application.

# bMaxPower for the console CDC-ACM function, in 2 mA units: 50 = 100 mA, the same
# figure the Open Bootloader declares, so a card asks for the same budget whether it is
# running this image or sitting in serial recovery. The device-next default is 125
# (250 mA); nothing on this card needs it - the nRF52840 radio peaks around 20 mA and
# the module is powered from the mPCIe/M.2 slot, not from VBUS.
CONFIG_CDC_ACM_SERIAL_MAX_POWER=50
