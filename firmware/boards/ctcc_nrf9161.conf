# Boot banner
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=y
# No BOOT_BANNER_STRING here: firmware/VERSION exists, so the banner patch takes its
# APP_VERSION_STRING branch and never reads the fallback string. tests/assembly has
# no VERSION file and does set it.

# APPROTECT (debug read-back lock) is defaulted board-wide by patches/zephyr/0003
# (the NRF_APPROTECT_HANDLING choice defaults to LOCK - a default, so a .conf can
# override it), so it is not set here - but nothing built in
# this repository actually locks: firmware/prj.conf opts every target back out with
# CONFIG_NRF_APPROTECT_USE_UICR=y (which selects the SoC's default handling, so the
# MDK's SystemInit does not force-protect this secure image; TF-M is not built for a
# non-/ns target) plus CONFIG_CTCC_APP_PROTECT=n. Product firmware must lock.

# nRF91 has a SECOND access port, and patches/zephyr/0003 now defaults its choice
# (NRF_SECURE_APPROTECT_HANDLING) to LOCK too, so SystemInit would force-protect it
# on every boot. Opt this target back out as well: nothing built in this repository
# locks a card, on either port. The symbol is declared for every Nordic SoC but carries
# `depends on SOC_NRF5340_CPUAPP || SOC_SERIES_NRF91`, so on nRF52840 its dependency
# is unmet and assigning it there logs "was assigned y but got n" - a warning, not an
# error. That is why it lives in a per-board conf rather than beside the other two
# opt-outs.
CONFIG_NRF_SECURE_APPROTECT_USE_UICR=y

# NOT BUILT BY CI. The matrix builds ctcc/nrf52840 and the two /ns targets; this
# secure-side variant exists for a product that wants the secure domain, and its
# fragments are therefore only exercised by hand. Verified manually against NCS
# v3.4.0: `west build --sysbuild -b ctcc/nrf9151 firmware/` configures, and the
# resolved .config carries NRF_APPROTECT_USE_UICR=y, NRF_SECURE_APPROTECT_USE_UICR=y
# and no CTCC_APP_PROTECT - i.e. both ports stay open, as intended. Re-check by hand
# after touching this file or patches/zephyr/0003.
#
# One thing main had and this branch does not: main's board Kconfig.defconfig clamped
# FLASH_LOAD_SIZE for the secure target. patches/zephyr/0002 selects
# USE_DT_CODE_PARTITION only for the /ns variants, so a secure image here links
# against the whole flash rather than a slot. That is correct for a standalone secure
# application and wrong for one behind MCUboot - so if a product builds this target
# WITH the bootloader, add the clamp back before trusting the image size.
