# Boot banner
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=y
# No BOOT_BANNER_STRING here: firmware/VERSION exists, so the banner patch takes its
# APP_VERSION_STRING branch and never reads the fallback string. tests/assembly has
# no VERSION file and does set it.

# nRF91 has a SECOND access port, and patches/zephyr/0003 now defaults its choice
# (NRF_SECURE_APPROTECT_HANDLING) to LOCK too. On a /ns target the actor is TF-M, not
# this image: its init_debug() -> configure_approtect_nvmc() writes
# UICR.SECUREAPPROTECT with nrfx_nvmc_word_write(), which is PERMANENT - not the
# volatile per-boot FORCEPROTECT a secure image's SystemInit applies. Opt this target back out as well: nothing built in this repository
# locks a card, on either port. The symbol is declared for every Nordic SoC but carries
# `depends on SOC_NRF5340_CPUAPP || SOC_SERIES_NRF91`, so on nRF52840 its dependency
# is unmet and assigning it there logs "was assigned y but got n" - a warning, not an
# error. That is why it lives in a per-board conf rather than beside the other two
# opt-outs.
CONFIG_NRF_SECURE_APPROTECT_USE_UICR=y
