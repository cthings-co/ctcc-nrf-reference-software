# Do NOT lock the debug port from the example. The ctcc board defaults the
# NRF_APPROTECT_HANDLING choice to NRF_APPROTECT_LOCK for every image
# (patches/zephyr/0003) - a choice DEFAULT, which is why a .conf can override it at
# all; a `select` could not be. Left alone it would make
# the app_protect helper write UICR.APPROTECT and reset on the first boot of this
# image on nRF52840 - so running the example once would lock the card, and the next
# flash over SWD would need `nrfjprog --recover` first. Selecting the SoC's default
# handling reverts that, and dropping the helper keeps it out of the image entirely
# (see drivers/misc/app_protect/Kconfig). The Open Bootloader built here does the
# same, so nothing in this repository locks a card - product firmware should, on the
# bootloader as well as the application.
#
# The CTCC_APP_PROTECT=n line below is load-bearing on THREE of the five targets, not
# on nRF52840 alone. The helper has no SoC dependency of any kind:
# drivers/misc/app_protect/Kconfig declares it `default y` with
# `depends on !ARM_NONSECURE_FIRMWARE`, so it is compiled into ctcc/nrf52840,
# ctcc/nrf9151 and ctcc/nrf9161 alike and is excluded only from the two /ns targets.
# On those three this line is the only thing stopping the first boot from writing
# UICR and resetting.
#
# NRF_APPROTECT_USE_UICR=y is load-bearing on every target, and on nRF91 it prevents a
# PERMANENT lock rather than merely a per-boot one. Which agent acts depends on the
# image: in a SECURE nRF91 image the MDK's SystemInit sets APPROTECT.FORCEPROTECT,
# which is volatile and gone after an erase; on a /ns target TF-M is the actor and its init_debug() ->
# configure_approtect_nvmc() writes the UICR word with nrfx_nvmc_word_write() -
# a flash write, PERMANENT, needing `nrfjprog --recover` afterwards. nRF91's
# SECOND, secure access port is opted out per board instead, in
# firmware/boards/ctcc_nrf91*.conf: the symbol is declared for every Nordic SoC but
# depends on SOC_NRF5340_CPUAPP || SOC_SERIES_NRF91, so assigning it on nRF52840 only
# logs "was assigned y but got n".
CONFIG_NRF_APPROTECT_USE_UICR=y
CONFIG_CTCC_APP_PROTECT=n

