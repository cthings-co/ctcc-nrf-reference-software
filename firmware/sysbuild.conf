# Sysbuild configuration for the example application.
#
# MCUboot is the only thing this example asks for; the flash layout and the
# upgrade mode are left at the SDK default on purpose, so this stays a stock
# nRF Connect SDK build for the ctcc board:
#
#   * partitions come from the board devicetree - Partition Manager is deprecated
#     and off by default in this SDK,
#   * the upgrade mode is the NCS default, SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE,
#     which the board's equal-sized slots support.
#
# Product firmware may want to deviate - a single-slot loader, or a pinned flash
# map matching cards already in the field. That belongs in a product repository,
# not in an example.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Keep the debug port open in EVERY image of this build, in one place.
#
# NCS offers this at sysbuild level (nrf/sysbuild/Kconfig.approtect): it sets
# CONFIG_NRF_APPROTECT_USE_UICR in the application, in MCUboot, and in any image a
# future sysbuild addition brings along - so a new child image cannot inherit the
# board's LOCK default just because nobody remembered to add a fragment for it. The
# symbol depends on SOC_SERIES_NRF52 || NRF53 || NRF91, so it is valid for all five
# ctcc targets.
#
# The per-image CONFIG_NRF_APPROTECT_USE_UICR lines in firmware/prj.conf and
# firmware/sysbuild/mcuboot/prj.conf are deliberately kept as well. They are not
# redundant: this file is read only by a sysbuild build, and both a
# `west build --no-sysbuild` of firmware/ and the assembly test (which is never a
# sysbuild build) rely on their own. For a "must not lock" invariant, having it stated
# where each image can see it is worth the repetition.
#
# nRF91's SECOND access port has its own sysbuild choice, SB_CONFIG_SECURE_APPROTECT_*,
# but it depends on SOC_SERIES_NRF91 and this file has no per-board variant - setting
# it here would log an unmet-dependency warning on every nRF52840 build. It therefore
# stays in firmware/boards/ctcc_nrf91*.conf and
# firmware/sysbuild/mcuboot/boards/ctcc_nrf91*.conf.
SB_CONFIG_APPROTECT_USE_UICR=y

# Do not push MCUBOOT_UPDATEABLE_IMAGES into the application image.
#
# nrf/sysbuild/CMakeLists.txt:281-285 syncs CONFIG_UPDATEABLE_IMAGE_NUMBER into every
# updateable image when SB_CONFIG_MCUBOOT_APP_SYNC_UPDATEABLE_IMAGES is set, and that
# option is `default y` (nrf/sysbuild/Kconfig.mcuboot:164-166). The example application
# has no image manager, so UPDATEABLE_IMAGE_NUMBER is an inactive symbol there and the
# assignment produced a Kconfig warning on every firmware and bootloader build:
#
#   warning: UPDATEABLE_IMAGE_NUMBER ... was assigned the value '1' but got the value ''.
#   Check these unsatisfied dependencies: ... (!MCUBOOT && IMG_MANAGER) (=n)
#
# The number still reaches MCUboot itself, which is the image that acts on it; only the
# redundant copy in the application is dropped. This costs nothing and does not require
# turning on IMG_MANAGER just to satisfy a value the application never reads.
SB_CONFIG_MCUBOOT_APP_SYNC_UPDATEABLE_IMAGES=n
