# Disable logging
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# MCUBoot serial configuration
CONFIG_BOOT_SERIAL_CDC_ACM=y

# Required by USB
CONFIG_MULTITHREADING=y

# USB
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_BOOT_USB_DFU_WAIT=n

# Disable Flash Patch
CONFIG_DISABLE_FLASH_PATCH=y

# USB descriptors
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_MANUFACTURER="CTHINGS.CO"
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_PRODUCT="CTCC-MCUBOOT"
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_VID=0x37A1
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_PID=0x0101
CONFIG_BOOT_SERIAL_CDC_ACM_MAX_POWER=125

# The Open Bootloader makes no GPIO use: no GPIO-triggered recovery entrance
# (BOOT_SERIAL_ENTRANCE_GPIO=n) and nRF52840 USB detects VBUS via the USB
# peripheral, not a pin. Drop the GPIO + GPIOTE driver the board enables by
# default (~3.6 KB of loader flash). Application images are separate sysbuild
# images and keep their own CONFIG_GPIO, so this does not affect application
# GPIO use.
CONFIG_GPIO=n
