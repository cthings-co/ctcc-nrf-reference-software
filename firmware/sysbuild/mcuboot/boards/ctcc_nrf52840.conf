# Disable logging
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# MCUBoot serial configuration
CONFIG_BOOT_SERIAL_CDC_ACM=y

# Required by USB
CONFIG_MULTITHREADING=y

# USB
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_BOOT_USB_DFU_WAIT=n

# Disable Flash Patch
CONFIG_DISABLE_FLASH_PATCH=y

# USB descriptors
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_MANUFACTURER="CTHINGS.CO"
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_PRODUCT="CTCC-MCUBOOT"
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_VID=0x37A1
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_PID=0x0101
# bMaxPower, in 2 mA units: 50 = 100 mA. One unit load, the USB 2.0 ceiling for a
# low-power function, so any port must be able to serve it - and it is what the
# deployed cards' loaders already advertise, since the legacy stack master used
# defaults USB_MAX_POWER to 50. MCUboot's own default of 125 would ask the host to
# budget 250 mA for a bootloader that runs no radio and only writes flash.
# CTHINGS.CO production firmware declares the same figure, so a card asks for the
# same budget whichever loader it is carrying.
CONFIG_BOOT_SERIAL_CDC_ACM_MAX_POWER=50

# The Open Bootloader makes no GPIO use: no GPIO-triggered recovery entrance
# (BOOT_SERIAL_ENTRANCE_GPIO=n) and nRF52840 USB detects VBUS via the USB
# peripheral, not a pin. Drop the GPIO + GPIOTE driver the board enables by
# default (~3.6 KB of loader flash). Application images are separate sysbuild
# images and keep their own CONFIG_GPIO, so this does not affect application
# GPIO use.
CONFIG_GPIO=n
