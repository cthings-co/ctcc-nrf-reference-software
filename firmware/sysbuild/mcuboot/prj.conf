# Do NOT lock the debug port from the Open Bootloader. The ctcc board defaults the
# NRF_APPROTECT_HANDLING choice to NRF_APPROTECT_LOCK for every image
# (patches/zephyr/0003) - a choice DEFAULT, overridable from a .conf, unlike a
# `select`. The loader is
# the first image to run on a fresh card - so with it, flashing this reference
# bootloader once locked the card, and every later SWD flash needed
# `nrfjprog --recover` first. Two paths have to be reverted, because two things act
# on that symbol:
#
#   * CONFIG_NRF_APPROTECT_LOCK makes the SDK compile the MDK with ENABLE_APPROTECT
#     (zephyr/modules/hal_nordic/nrfx/CMakeLists.txt), and SystemInit() then locks
#     the APPROTECT firmware branch. Selecting the SoC's default handling instead
#     (NRF_APPROTECT_USE_UICR) reverts that.
#   * the ctcc app_protect SYS_INIT helper writes UICR.APPROTECT and resets.
#     Dropping it keeps it out of the image entirely.
#
# This is a development reference: the loader VERIFIES application images against
# MCUboot's public development key (the loader itself is unsigned - nothing verifies
# a bootloader),
# so locking the debug port protects nothing here. A production build should lock
# instead, on the loader as well as the application.
CONFIG_NRF_APPROTECT_USE_UICR=y
CONFIG_CTCC_APP_PROTECT=n

CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
CONFIG_PICOLIBC_IO_MINIMAL=y
CONFIG_CBPRINTF_NANO=y

# Stack size
CONFIG_MAIN_STACK_SIZE=10240

# MCUBoot serial configuration
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000

# Report each slot's image hash in the serial-recovery image list, so a host can tell
# WHICH image is in a slot rather than only that one is present. MCUboot marks this
# `default y`, but it resolves to n unless asked for here, and a loader that cannot
# name its slots makes an automated flash-and-verify step guess.
CONFIG_BOOT_SERIAL_IMG_GRP_HASH=y

# No swap algorithm is selected here, on purpose: sysbuild owns the upgrade mode and
# force-writes it from SB_CONFIG_MCUBOOT_MODE_*, so an assignment in this file would
# either be overridden or produce a Kconfig warning. The example leaves that at the
# SDK default (swap-using-move). MCUboot's in-tree ctcc board conf
# (patches/mcuboot/0001) pins the same algorithm for standalone MCUboot builds,
# which our builds never read: firmware/sysbuild/mcuboot/ becomes the MCUboot
# image's application configuration directory and REPLACES MCUboot's own prj.conf
# and boards/ directory.

# Flash & SPI NOR
CONFIG_FLASH=y
CONFIG_FPROTECT=y
CONFIG_SPI_NOR=n

