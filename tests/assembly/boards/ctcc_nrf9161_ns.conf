CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
# No board .overlay is needed for the external flash: patches/zephyr/0002 sets
# mx25r6435 status="okay" in ctcc_nrf91{51,61}_common.dtsi, so the node is already
# enabled for every image built for these targets.

# nRF91 console is uart0 (UARTE). The shared prj.conf enables CONSOLE_GETCHAR, whose
# tty layer is interrupt-driven and ring-buffered while either buffer is non-zero.
# Setting both to 0 makes it UNBUFFERED: with a zero-capacity ring buffer
# subsys/console/tty.c:104-112 falls through to a uart_poll_out() per byte, and the
# read side likewise. What that buys is the ~576 bytes of RAM the two buffers would
# occupy, plus a simpler path with no IRQ callback to install - not delivery. Buffered
# operation is not broken here, and printk is unaffected either way: it goes through
# the console backend, not this tty layer.
# Note UART_INTERRUPT_DRIVEN stays in the image regardless: CONSOLE_GETCHAR selects it
# (subsys/console/Kconfig), the buffer sizes do not. The nRF52840 target keeps the
# buffered path; its USB CDC ACM console drives it fine.
CONFIG_CONSOLE_PUTCHAR_BUFSIZE=0
CONFIG_CONSOLE_GETCHAR_BUFSIZE=0

# nRF91 has a SECOND access port, and patches/zephyr/0003 now defaults its choice
# (NRF_SECURE_APPROTECT_HANDLING) to LOCK too. On a /ns target the actor is TF-M, not
# this image: its init_debug() -> configure_approtect_nvmc() writes
# UICR.SECUREAPPROTECT with nrfx_nvmc_word_write(), which is PERMANENT - not the
# volatile per-boot FORCEPROTECT a secure image's SystemInit applies. Opt this target back out as well: nothing built in this repository
# locks a card, on either port. The symbol is declared for every Nordic SoC but carries
# `depends on SOC_NRF5340_CPUAPP || SOC_SERIES_NRF91`, so on nRF52840 its dependency
# is unmet and assigning it there logs "was assigned y but got n" - a warning, not an
# error. That is why it lives in a per-board conf rather than beside the other two
# opt-outs.
CONFIG_NRF_SECURE_APPROTECT_USE_UICR=y
