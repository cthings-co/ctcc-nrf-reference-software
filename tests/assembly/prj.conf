# Do NOT lock the debug port from the assembly test. The ctcc board defaults the
# NRF_APPROTECT_HANDLING choice to NRF_APPROTECT_LOCK for every image
# (patches/zephyr/0003) - a choice default, which is what lets the two lines below
# override it at all. Left alone it would make the
# app_protect helper write UICR.APPROTECT and reset on the first boot of this
# (secure) image on nRF52840, and make TF-M write UICR.APPROTECT permanently on nRF91 -
# i.e. running the assembly test would lock the card it is meant to qualify, and
# the line would need `nrfjprog --recover` before flashing anything else.
# Selecting the SoC's default handling reverts both paths; dropping the helper as
# well keeps it out of the image entirely (see drivers/misc/app_protect/Kconfig).
# The example firmware and the Open Bootloader do the same, so nothing built in
# this repository locks a card; production firmware should.
# nRF91's SECOND access port is opted out per board instead, in
# boards/ctcc_nrf91*_ns.conf - CONFIG_NRF_SECURE_APPROTECT_USE_UICR does not exist
# on nRF52840, so it cannot live here.
CONFIG_NRF_APPROTECT_USE_UICR=y
CONFIG_CTCC_APP_PROTECT=n

# CTHINGS.CO boot banner. NCS_BOOT_BANNER=n is the load-bearing key: sdk-nrf ships
# `configdefault BOOT_BANNER / default n if NCS_BOOT_BANNER` and NCS_BOOT_BANNER
# defaults y, and that default is prepended ahead of Zephyr's own `default y`, so
# without this line BOOT_BANNER resolves n, the CTHINGS.CO printk from
# patches/zephyr/0001 is compiled out (it sits inside `#ifdef CONFIG_BOOT_BANNER`)
# and NCS prints its own banner instead. Setting NCS_BOOT_BANNER=n makes that
# condition false, so BOOT_BANNER falls through to Zephyr's `default y` and is y on
# its own - BOOT_BANNER=y below is therefore redundant today, kept explicit so the
# requirement stays visible if anything ever re-enables NCS_BOOT_BANNER.
# On main the deleted board's *_defconfig carried the pair, so every image built for
# the card inherited it; the board now comes from the SDK without it, which is why
# each image sets it for itself (firmware/boards/ctcc_*.conf do the same).
#
# BOOT_BANNER_STRING, unlike in firmware/, is live here. The patch prints the
# firmware revision when <zephyr/app_version.h> exists and falls back to
# `*** <BOOT_BANNER_STRING> <Zephyr version> <postfix> ***` otherwise. Note patch 0001
# adds a space upstream does not, so with the string empty and BOOT_DELAY at its default
# the line actually renders with doubled spaces - `***  4.4.0  ***` on this SDK. Cosmetic, and
# left alone rather than diverging the patch further from upstream. tests/assembly/ has no
# VERSION file - unlike firmware/, which carries firmware/VERSION and so always takes
# the revision branch - so this build takes the fallback and an empty string trims it
# to the Zephyr version alone rather than "Booting Zephyr OS build". These images
# announce no revision of their own; they are qualification tools, not shipped
# firmware, and the card's revision comes from the image flashed after the test.
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=y
CONFIG_BOOT_BANNER_STRING=""

# Ztest configs
CONFIG_ZTEST=y
CONFIG_TEST_USERSPACE=n
CONFIG_ZTEST_STACK_SIZE=4096

# Common configs
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETCHAR_BUFSIZE=64
CONFIG_CONSOLE_PUTCHAR_BUFSIZE=512
